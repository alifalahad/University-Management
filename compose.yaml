services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: university
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/university
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db
    restart: on-failure
